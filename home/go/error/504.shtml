<hrml>

<head>
<title>Gateway Timeout</title>

<style>
.loader {
  font-weight: bold;
  font-family: sans-serif;
  font-size: 30px;
  animation: l1 1s linear infinite alternate;
}
.loader:before {
  content:"Gateway Timeout..."
}
@keyframes l1 {to{opacity: 0}}


.Outer {display: table;height: 100%;width: 100%;}
.Middle {display: table-cell;vertical-align: middle;}
.Inner {margin-left: auto;margin-right: auto; width: 80%;padding:20px;font-weight:normal;FONT-SIZE: 17px; COLOR: #000000;font-family:Helvetica Neue,Helvetica,Arial;line-height:30px;text-align:center}

</style>

<meta http-equiv="refresh" content="3">
</head>

<body>

<div class=Outer>
	<div class=Middle>
		<div class=Inner>
		
			<div class="loader"></div>
			
		</div>
	</div>
</div>






</body>

</html>
