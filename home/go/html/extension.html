<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<header>

	<form name=CheckForm id=CheckForm action='$CurrentFileName'>
	<input type=hidden name=Action id=Action>
	
	<div class=DivXTable>
	<table cellPadding='8' cellSpacing='0' width='100%' class='Table'>

	<THEAD>
	
	<tr>
	
    <TH align='$DAlign' width='35%'>
    <a href="javascript:Load('$CurrentFileName?&SortBy=Name')">{$LNG['Name']}</a>
    </TH>

    <TH align='$DAlign' width='20%'>
    <a href="javascript:Load('$CurrentFileName?&SortBy=Status')">{$LNG['Status']}</a>
    </TH>
	
    <TH align='$DAlign' width='35%'>
    <a href="javascript:Load('$CurrentFileName?&SortBy=Description')">{$LNG['Description']}</a>
    </TH>

    <TH width='10%'>
 
    </TH>
	
	</tr>
	
	</THEAD>
	
	<TBODY>

</header>

<loop>

	<tr id='TR{$ID}' class='$TDColor' divid=Find find='{$Row['Name']}'>

    <TD>
    {$Name}
    </td>

	<TD>
    $Status
    </td>

	<TD>
	{$Row['Description']}
    </td>
	
	<TD align='$OAlign'>
	
	$ActionLink
	
	</td>
    
	</tr>

</loop>

<footer>


	</TBODY>
	
	<TFOOT>

	<th align='$DAlign' colspan=2>
	
	</th>
	
	<th align='$OAlign' colspan=3>
	
	</th>

	</TFOOT>

	</TABLE>
	</div>
	</form>

	
</footer>
