<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>
	
	<div class=UNavigator>GoAdmio Installed on $InstallDate</div>		
	
	<if $Version==$Latest>
		
		<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">
		<div class=DivCheckbox>
		
			<label class=LabelCheckbox>Force a reinstall even if the system is up to date
				<input type='checkbox' name='ForceUpdate' id='ForceUpdate' value='1' onclick="document.getElementById('Submit').style.display=''" $ForceUpdateChecked>
				<span class='Checkbox'></span>
			</label>
		
		</div>

		<div id=DivSubmit class=DivSubmit>
		<input type=button id=Submit onclick='Update()' value='{$LNG['UpdateNow']}' Class=InputButton style='display:none'>
		</div>
		</form>
		
	</if>

</content>
