<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
	
</nav>

<header>

	<form name=CheckForm id=CheckForm action='$CurrentFileName'>
	<input type=hidden name=Action id=Action>

	<div class=DivXTable>
	<table cellPadding='8' cellSpacing='0' width='100%' class='Table'>

	<THEAD>
	
	<tr>
	
    <TH align=$DAlign width='50%'>
    <a href="javascript:Load('$CurrentFileName?SortBy=Type&ControlID=$ControlID&Page=$Page','$ControlID')">{$LNG['Datacenter']}</a>
    </TH>

    <TH align=$DAlign width='25%'>
    <a href="javascript:Load('$CurrentFileName?SortBy=IPs&ControlID=$ControlID&Page=$Page','$ControlID')">{$LNG['IPs']}</a>
    </TH>

    <TH align=$OAlign width='25%'>
	{$LNG['Blocked']}
    </TH>
	
	</tr>
	
	</THEAD>
	
	<TBODY>

</header>

<loop>

    <tr id='TR{$ID}' class='$TDColor' divid=Find find='{$Row['Type']}-{$Row['IPs']}'>

    <TD>
    {$Row['Type']}
    </TD>
	
	<TD>
    {$Row['IPs']}
    </TD>
	
	<TD align='$OAlign'>
	$BlockCode
	</TD>
    
	</tr>

</loop>

<footer>


	</TBODY>
	
	<TFOOT>

    <tr>

		<th align='$DAlign'>
		Showing $X of $RowsNo records.
		</th>
		
		<th align='$OAlign' colspan=2>

		</th>

    </tr>

	</TFOOT>
	
    </TABLE>
	</form>

	
</footer>
