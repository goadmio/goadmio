<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>

	$Error

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">
	<input type='hidden' name='ScriptFile' value='$ScriptFile'>
	<input type='hidden' name='NavigatorTitle' value='$NavigatorTitle'>
	<input type='hidden' name='ControlID' value='$ControlID'>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Domain']}<br>
	$SelectDomain	
	</div>



<!-- Folder Selector Component - No Search -->
<div class="folder-selector-wrapper">
    <div class="folder-tree-list" id="folderTreeContainer">
        <!-- Folder tree will be rendered here -->
    </div>
</div>

	<div class='DivInput {$Dir}DivInput'>Directory<br>	
	<input type='Text' name='Directory' id='Directory' value='$Directory' maxlength=255 class=InputText>
	</div>
	
	<div class='DivInput {$Dir}DivInput'>{$LNG['Version']}<br>
	$SelectVersion
	</div>
	
	<div class='DivInput {$Dir}DivInput'>
	{$LNG['DatabaseName']}
	<br>
	<input type='text' name='Name' id='Name' value='$Name' pattern="^.*[^_]$" class=InputText maxlength=100>
	</div>

	<div class='DivInput {$Dir}DivInput'>
	{$LNG['DatabaseUsername']}
	<br>
	<input type='text' name='User' id='User' value='$User' pattern="^.*[^_]$" class=InputText maxlength=100><br />
	</div>

	<div class='DivInput {$Dir}DivInput'>Database Password<br>
	<input type='password' name='Pass' id=Password autocomplete='new-password' class=InputText maxlength=100 required>  <span onclick="GeneratePassword('Password')" style='cursor:pointer'>Generate Password</span>
	</div>
	
	<div id=DivSubmit class=DivSubmit>

	<input type=submit value='{$LNG['Install']}' class=InputButton>
	
	</div>

	</form>


</content>
