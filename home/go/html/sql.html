<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>

	$Error

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">
	<input type='hidden' name='WWWPath' value='$WWWPath'>

	

<!-- Folder Selector Component - No Search -->
<div class="folder-selector-wrapper">
    <div class="folder-tree-list" id="folderTreeContainer">
        <!-- Folder tree will be rendered here -->
    </div>
</div>



	
	
	<div class='DivInput {$Dir}DivInput'>SQL File Path<br>	
	<input type='Text' name='Database' id='Database' value='$Database' maxlength=255 class=InputText>
	</div>
	
	<div class='DivInput {$Dir}DivInput'>{$LNG['Domain']}<br>

		$SelectDomain
	
	</div>
	
	<div class='DivInput {$Dir}DivInput'>{$LNG['DatabaseName']}<br>
	<input type='Text' name='Name' value='$Name' maxlength=100 class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['DatabaseUsername']}<br>
	<input type='Text' name='Username' value='$Username' maxlength=100 class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Password']}<br>
	<input type='password' name='Password' id='Password' pattern='^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$' title='Must contain at least one number, one uppercase letter, one lowercase letter, and be at least 8 characters long' autocomplete='new-password' required maxlength=100 class=InputText>
	</div>
	
	<div id=DivSubmit class=DivSubmit>

	<input type=submit value='{$LNG['Import']}' Class=InputButton>
	
	</div>

	</form>


</content>
