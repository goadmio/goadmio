<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>

	$Error

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">

	<div class='TitleB {$Dir}TitleB'>
	{$LNG['NameserversTitle']}
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Nameserver1']}:<br>
	<input type='text' name='NS1' value='$NS1' class=InputText maxlength=100>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Nameserver2']}:<br>
	<input type='text' name='NS2' value='$NS2' class=InputText maxlength=100>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Nameserver3']}:<br>
	<input type='text' name='NS3' value='$NS3' class=InputText maxlength=100>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['Nameserver4']}:	<br>
	<input type='text' name='NS4' value='$NS4' class=InputText maxlength=100>
	</div>

	<div id=DivSubmit class=DivSubmit>
	<input type=submit value='{$LNG['Save']}' Class=InputButton>
	</div>

	</form>

</content>
