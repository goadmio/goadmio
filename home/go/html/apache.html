<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>

	$Error

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">
	<input type=hidden name=Edit value='$Edit'>

	<div class='DivInput {$Dir}DivInput'>DirectoryIndex<br>
	<input type='text' value='$DirectoryIndex' id='DirectoryIndex' onchange="Apache('/go/directoryindex',encodeURI(document.getElementById('DirectoryIndex').value),'DirectoryIndex')" class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>KeepAlive<br>
	<input type='text' value='$KeepAlive' id='KeepAlive' onchange="Apache('/go/keepalive',encodeURI(document.getElementById('KeepAlive').value),'KeepAlive')" class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>KeepAliveTimeout<br>
	<input type='text' value='$KeepAliveTimeout' id='KeepAliveTimeout' onchange="Apache('/go/keepalivetimeout',encodeURI(document.getElementById('KeepAliveTimeout').value),'KeepAliveTimeout')" class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>MaxKeepAliveRequests<br>
	<input type='text' value='$MaxKeepAliveRequests' id='MaxKeepAliveRequests' onchange="Apache('/go/maxkeepaliverequests',encodeURI(document.getElementById('MaxKeepAliveRequests').value),'MaxKeepAliveRequests')" class=InputText>
	</div>

	<div class='DivInput {$Dir}DivInput'>Log Rotate<br>

		<label class="radio-enhanced">
			<input type='radio' name='LogRotate' id=LogRotateWeekly onclick="Apache('/go/logrotate','7','LogRotateWeekly')" $CheckedLogRotateWeekly>
			<span class="radio-custom"></span>
			<span class="radio-label-text">
			Weekly
			</span>
		</label>
		
		<label class="radio-enhanced">
			<input type='radio' name='LogRotate' id=LogRotateDaily onclick="Apache('/go/logrotate','1','LogRotateDaily')" $CheckedLogRotateDaily>
			<span class="radio-custom"></span>
			<span class="radio-label-text">
			Daily
			</span>
		</label>

	</div>




	</form>

</content>
