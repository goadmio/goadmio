<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
</nav>

<content>

	$Error

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">

	<div class='TitleB {$Dir}TitleB'>
	{$LNG['ContactInformation']}
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['AdministratorEmail']}:<br>
	<input type='text' name='AdminEmail' value='{$AdminEmail}' class='InputText' maxlength='1000' placeholder='email1@domain.com,email2@domain.com' required>
	</div>

	<div class='DivInput {$Dir}DivInput'>Administrator Mobile:<br>
	<input type="text" name="AdminMobile" value="{$AdminMobile}" class="InputText" maxlength="255" placeholder="+201006931666,+201111144055" pattern="^(\+\d+,?)+$" title="Enter one or more phone numbers separated by commas (e.g., +201006931666,+201111144055)" required>
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['CronEmail']}:<br>
	<input type='email' name='CronEmail' value='$CronEmail' class=InputText maxlength=100>
	</div>

	<div class=DivCheckbox>
	
		<label class=LabelCheckbox>Send IMAP Configuration to New Email Users
			<input type='checkbox' name='IMAPAlert' id='IMAPAlert' value='1' $IMAPAlertChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>

	<div class=DivCheckbox>
	
		<label class=LabelCheckbox>Enable Junk Mail Filter
			<input type='checkbox' name='Junk' id='Junk' value='1' $JunkChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>

	<div class=DivCheckbox>
	
		<label class=LabelCheckbox>Enable Auto-Heal
			<input type='checkbox' name='Heal' id='Heal' value='1' $HealChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>


	<div class=DivCheckbox>
	
		<label class=LabelCheckbox>Enable PermitRootLogin
			<input type='checkbox' name='PermitRootLogin' id='PermitRootLogin' value='1' $PermitRootLoginChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>

	<div class=DivCheckbox>

		<label class=LabelCheckbox>Remote MariaDB Database Access
			<input type='checkbox' name='RemoteMariaDB' id='RemoteMariaDB' value='1' $RemoteMariaDBChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>

	<div class=DivCheckbox>
	
		<label class=LabelCheckbox>Enable Welcome Page
			<input type='checkbox' name='Welcome' id='Welcome' value='1' $WelcomeChecked>
			<span class='Checkbox'></span>
		</label>
	
	</div>

	<div id=DivSubmit class=DivSubmit>
	<input type=submit value='{$LNG['Save']}' Class=InputButton>
	</div>

	</form>

</content>
