<nav>

	<div class=Navigator>
		
		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][0]}'>{$Navigator['Name'][0]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;</span>

		<a class='NavigatorLink {$Dir}NavigatorLink' href='{$Navigator['URL'][1]}'>{$Navigator['Name'][1]}</a>
		<span class='NavigatorLink {$Dir}NavigatorLink'>&nbsp;&raquo;&nbsp;{$Navigator['Name'][2]}</span>

	</div>
	
	
</nav>

<content>

	<form name="Form" method="POST" onsubmit="return Submit('$CurrentFileName');" autocomplete="off" action="$CurrentFileName">

	<div class='DivInput {$Dir}DivInput'>{$LNG['PrimaryResolver']}<br>		
	<input type='text' name='PrimaryIP' value='$PrimaryIP' class=InputText50 maxlength=100> $PrimaryFlag
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['SecondaryResolver']}<br>
	<input type='text' name='SecondaryIP' value='$SecondaryIP' class=InputText50 maxlength=100> $SecondaryFlag
	</div>

	<div class='DivInput {$Dir}DivInput'>{$LNG['TertiaryResolverOptional']}<br>
	<input type='text' name='TertiaryIP' value='$TertiaryIP' class=InputText50 maxlength=100> $TertiaryFlag
	</div>
	
	<div id=DivSubmit class=DivSubmit>
	<input type=submit value="{$LNG['Save']}" Class=InputButton>
	</div>

	</form>

</content>
